<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aile Kan Tahlili Paneli</title>
<style>
  :root {

    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --border: rgba(11,11,11,0.10); --border-strong: rgba(11,11,11,0.20);

    --radius: 10px;
  }

      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
      --bg-danger: #4a1b0c; --text-danger: #f7c1c1;
      --bg-accent: #042c53; --text-accent: #85b7eb; --border-accent: #185fa5;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--surface-0); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  button, select { font-family: inherit; }
  #page { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  header { flex: 0 0 auto; padding: 0.5rem 1.25rem; border-bottom: 0.5px solid var(--border); }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title-row-compact { justify-content: flex-end; }

  select#personSelect {
    font-size: 14px; font-weight: 500; border-radius: var(--radius);
    border: 0.5px solid var(--border-strong); background: var(--surface-1);
    color: var(--text-primary); padding: 7px 12px; cursor: pointer;
  }

  .layout { flex: 1; min-height: 0; display: flex; flex-direction: row; }

  .chart-panel {
    flex: 1.35; min-width: 0; display: flex; flex-direction: column;
    padding: 1rem 1.1rem; gap: 8px; border-right: 0.5px solid var(--border);
  }
  .metric-header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .metric-title { font-size: 15px; font-weight: 600; margin: 0; }
  .metric-sub { font-size: 12px; color: var(--text-secondary); margin: 0; }
  .chart-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; -webkit-overflow-scrolling: touch; }
  .chart-item { flex: 0 0 auto; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 0.7rem 0.85rem; }
  .chart-item.primary { border-color: var(--border-accent); }
  .chart-item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .chart-item-head .info-btn { flex: 0 0 auto; }
  .chart-item-title { font-size: 13px; font-weight: 600; margin: 0; }
  .chart-item-title .related-dot { color: #e69e2b; margin-left: 4px; }
  .chart-item-canvas-wrap { position: relative; height: 190px; }
  .chart-item.primary .chart-item-canvas-wrap { height: 320px; }

  .related-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .related-grid .chart-item { padding: 0.55rem 0.65rem; }
  .related-grid .chart-item-title { font-size: 11.5px; }
  .related-grid .chart-item-canvas-wrap { height: 130px; }
  .related-grid .chart-item-caption { font-size: 10px; }
  .related-grid .chart-item-note { font-size: 9.5px; }
  .chart-item-caption { font-size: 11.5px; color: var(--text-secondary); margin: 4px 0 0; }
  .chart-item-note { font-size: 11px; color: var(--text-accent); margin: 2px 0 0; }

  .list-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .tabs { flex: 0 0 auto; display: flex; gap: 6px; flex-wrap: wrap; padding: 0.85rem 1.1rem 0.6rem; }
  .tabs button {
    font-size: 12.5px; border-radius: 999px; border: 0.5px solid var(--border-strong);
    background: var(--surface-1); color: var(--text-primary); padding: 5px 11px; cursor: pointer;
  }
  .tabs button.active { background: var(--bg-accent); color: var(--text-accent); border-color: var(--border-accent); }

  .list-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 1.1rem 1.25rem; -webkit-overflow-scrolling: touch; }
  .cat-heading { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 14px 0 6px; }
  .cat-heading:first-child { margin-top: 0; }
  .row {
    display: flex; align-items: center; justify-content: flex-start; gap: 10px;
    padding: 8px 9px; border-radius: 8px; cursor: pointer; border: 0.5px solid transparent;
  }
  .row > .name-wrap { flex: 1; min-width: 0; }
  .row:hover { background: var(--surface-1); }
  .row.active { background: var(--bg-accent); border-color: var(--border-accent); }
  .row.related { background: rgba(230, 158, 43, 0.10); border-color: rgba(230, 158, 43, 0.45); }
  .row.related .name::after {
    content: '•'; color: #e69e2b; margin-left: 5px; font-weight: 700;
  }
  .row .name { font-size: 13.5px; font-weight: 500; }
  .history-abn-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #e34948; margin-left: 6px; vertical-align: middle;
  }
  .row .ref { font-size: 11px; color: var(--text-muted); }
  .row .valwrap { text-align: right; }
  .row .val { font-size: 13.5px; font-weight: 600; }
  .row .val.abn { color: var(--text-danger); }
  .row .delta { font-size: 11px; color: var(--text-muted); margin-left: 4px; }
  .row .info-btn {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    border: 0.5px solid var(--border-strong); background: var(--surface-1); color: var(--text-secondary);
    font-size: 12px; font-weight: 600; line-height: 1; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .row .info-btn:hover { background: var(--bg-accent); color: var(--text-accent); border-color: var(--border-accent); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--surface-1); border-radius: var(--radius); border: 0.5px solid var(--border);
    max-width: 420px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 1.1rem 1.25rem;
  }
  .modal-card h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .modal-card .modal-cat { font-size: 11.5px; color: var(--text-muted); margin: 0 0 10px; }
  .modal-card p { font-size: 13.5px; color: var(--text-primary); margin: 0 0 10px; line-height: 1.55; }
  .modal-card .modal-ref { font-size: 12.5px; color: var(--text-secondary); background: var(--surface-0); border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
  .modal-close {
    display: block; margin-left: auto; font-size: 13px; border-radius: 999px;
    border: 0.5px solid var(--border-strong); background: var(--surface-0); color: var(--text-primary);
    padding: 6px 14px; cursor: pointer;
  }
  .notes-block { margin-top: 16px; padding: 10px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); }
  .notes-block p { font-size: 11.5px; color: var(--text-secondary); margin: 0 0 6px; }
  .notes-block ul { margin: 0; padding-left: 18px; }
  .notes-block li { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }

  @media (max-width: 820px) {
    header { padding: 0.5rem 0.9rem; }
    .layout { flex-direction: column; }
    .chart-panel {
      flex: 0 0 50%; min-height: 0; border-right: none; border-bottom: 0.5px solid var(--border);
      padding: 0.75rem 0.9rem;
    }
    .list-panel { flex: 0 0 50%; min-height: 0; }
    .tabs {
      padding: 0.7rem 0.9rem 0.5rem; flex-wrap: nowrap; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: 0 0 auto; }
    .list-scroll { padding: 0 0.9rem 1.25rem; }
    .chart-item.primary .chart-item-canvas-wrap { height: 160px; }
    .related-grid { grid-template-columns: repeat(2, 1fr); }
    .related-grid .chart-item-canvas-wrap { height: 110px; }
  }
  @media (max-width: 420px) {
    .related-grid .chart-item-canvas-wrap { height: 95px; }
    .related-grid .chart-item { padding: 0.45rem 0.5rem; }
  }
</style>
</head>

<div id="page">

    <div class="list-panel">

</div>

</div>

// Klinik olarak birlikte değerlendirilen test grupları (kaynak: standart laboratuvar panel
// tanımları - tam kan sayımı eritrosit indeksleri, lipid paneli, tiroid paneli, karaciğer
// enzimleri, böbrek paneli, demir paneli, pıhtılaşma paneli, glukoz metabolizması, elektrolitler).
const TEST_GROUPS = [
  ['HGB', 'HCT', 'RBC', 'MCV', 'MCH', 'MCHC', 'RDW', 'RDW-SD'],
  ['PLT', 'MPV', 'PDW', 'PCT', 'P-LCR'],
  ['WBC', 'NEU#', 'LYMPH#', 'MONO#', 'EO#', 'BASO#', 'IG#', 'NRBC#'],
  ['NEU%', 'LYMPH%', 'MONO%', 'EO%', 'BASO%', 'IG%', 'NRBC%'],
  ['Kolesterol', 'HDL', 'LDL', 'Trigliserid'],
  ['TSH', 'FT3', 'FT4', 'Anti-TPO'],
  ['Ferritin', 'Demir (Fe)', 'Transferrin', 'Transferrin Satürasyonu'],
  ['Vitamin B12', 'Folat'],
  ['ALT', 'AST', 'GGT', 'LDH'],
  ['Kreatinin', 'Üre', 'BUN', 'tGFH (eGFR)', 'Ürik Asit'],
  ['PT (Protrombin Zamanı)', 'aPTT', 'INR'],
  ['Glukoz (Açlık)', 'HbA1c', 'HbA1c (mmol)', 'İnsülin'],
  ['Potasyum (K)', 'Sodyum (Na)'],
];
const RELATED = {};
TEST_GROUPS.forEach(group => {
  group.forEach(test => {
    RELATED[test] = group.filter(t => t !== test);
  });
});
function relatedFor(person, test) {
  const related = RELATED[test] || [];
  if (!related.length) return [];
  const cats = DATA[person].categories;
  const present = new Set();
  for (const cat in cats) for (const t in cats[cat]) present.add(t);
  return related.filter(t => present.has(t));
}

const state = { person: null, cat: 'ALL', cat_key: null, test_cat: null, test_name: null, chart: null };

function fmtNum(v) {
  if (v === null || v === undefined) return '';
  if (Number.isInteger(v)) return String(v);
  const r = Math.round(v * 10000) / 10000;
  return String(r);
}
function isAbn(pt) {
  return pt.lo != null && pt.hi != null && (pt.v < pt.lo || pt.v > pt.hi);
}
function dateKey(d) {
  const [dd, mm, yyyy] = d.split('.');
  return yyyy + mm + dd;
}

function personSelect() { return document.getElementById('personSelect'); }

function initPersonSelect() {
  const sel = personSelect();
  sel.innerHTML = '';
  Object.keys(DATA).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = DATA[p].meta.name.split(' ')[0] || p;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => selectPerson(sel.value));
}

const PREFERRED_DEFAULT_TESTS = ['HGB', 'WBC', 'Glukoz (Açlık)', 'Kolesterol'];

function pickDefaultTest(person) {
  const cats = DATA[person].categories;
  for (const pref of PREFERRED_DEFAULT_TESTS) {
    for (const cat in cats) {
      if (cats[cat][pref]) return { cat, test: pref };
    }
  }
  for (const cat in cats) {
    const tests = Object.keys(cats[cat]);
    if (tests.length) return { cat, test: tests[0] };
  }
  return null;
}

function selectPerson(person) {
  state.person = person;
  state.cat = 'ALL';
  const def = pickDefaultTest(person);
  state.test_cat = def ? def.cat : null;
  state.test_name = def ? def.test : null;
  personSelect().value = person;
  renderHeader();
  renderTabs();
  renderList();
  renderCharts();
}

function renderHeader() {
  // Header artık sadece kişi seçme dropdown'unu içeriyor; isim/tarih/istatistik
  // kartları kaldırıldı (daha fazla içerik alanı için). Fonksiyon boş bırakıldı
  // çünkü başka yerlerden çağrılıyor.
}

function renderTabs() {
  const tabsEl = document.getElementById('categoryTabs');
  tabsEl.innerHTML = '';
  const cats = DATA[state.person].categories;
  const allBtn = document.createElement('button');
  allBtn.textContent = 'Tümü'; allBtn.dataset.cat = 'ALL';
  tabsEl.appendChild(allBtn);
  for (const cat in cats) {
    const b = document.createElement('button');
    b.textContent = cat; b.dataset.cat = cat;
    tabsEl.appendChild(b);
  }
  styleTabs();
  tabsEl.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    state.cat = e.target.dataset.cat;
    styleTabs();
    renderList();
  });
}
function styleTabs() {
  document.querySelectorAll('#categoryTabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === state.cat);
  });
}

function latestPt(series) {
  return series.pts[series.pts.length - 1];
}
function prevPt(series) {
  return series.pts.length > 1 ? series.pts[series.pts.length - 2] : null;
}
function deltaArrow(latest, prev) {
  if (!prev || typeof latest.v !== 'number' || typeof prev.v !== 'number') return '';
  const diff = latest.v - prev.v;
  if (Math.abs(diff) < 1e-9) return '·';
  return diff > 0 ? '▲' : '▼';
}

function renderList() {
  const listEl = document.getElementById('listScroll');
  listEl.innerHTML = '';
  const cats = DATA[state.person].categories;
  const catNames = Object.keys(cats).filter(c => state.cat === 'ALL' || state.cat === c);

  for (const cat of catNames) {
    const h = document.createElement('div');
    h.className = 'cat-heading';
    h.textContent = cat;
    listEl.appendChild(h);

    for (const test in cats[cat]) {
      const series = cats[cat][test];
      const last = latestPt(series);
      const prev = prevPt(series);
      const row = document.createElement('div');
      row.className = 'row';
      if (state.test_cat === cat && state.test_name === test) row.classList.add('active');
      if (state.test_name && test !== state.test_name && (RELATED[state.test_name] || []).includes(test)) {
        row.classList.add('related');
      }
      row.dataset.cat = cat; row.dataset.test = test;

      const left = document.createElement('div');
      left.className = 'name-wrap';
      const nameEl = document.createElement('div'); nameEl.className = 'name'; nameEl.textContent = test;
      if (series.pts.some(p => isAbn(p))) {
        const abnDot = document.createElement('span');
        abnDot.className = 'history-abn-dot';
        abnDot.title = 'Bu test bir veya daha fazla tarihte referans aralığının dışında sonuç verdi';
        nameEl.appendChild(abnDot);
      }
      const refEl = document.createElement('div'); refEl.className = 'ref';
      refEl.textContent = (last.lo != null) ? `${fmtNum(last.lo)} - ${fmtNum(last.hi)} ${series.unit}` : (series.unit || '');
      left.appendChild(nameEl); left.appendChild(refEl);

      const right = document.createElement('div'); right.className = 'valwrap';
      const valEl = document.createElement('span'); valEl.className = 'val' + (isAbn(last) ? ' abn' : '');
      valEl.textContent = (last.disp || fmtNum(last.v)) + ' ' + (last.unit || series.unit || '');
      const deltaEl = document.createElement('span'); deltaEl.className = 'delta';
      deltaEl.textContent = deltaArrow(last, prev);
      right.appendChild(valEl); right.appendChild(deltaEl);

      const infoBtn = document.createElement('button');
      infoBtn.className = 'info-btn'; infoBtn.type = 'button';
      infoBtn.textContent = '?';
      infoBtn.setAttribute('aria-label', test + ' hakkında bilgi');
      infoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openInfoModal(cat, test, series, last);
      });

      row.appendChild(left); row.appendChild(right); row.appendChild(infoBtn);
      row.addEventListener('click', () => {
        state.test_cat = cat; state.test_name = test;
        renderList();
        renderCharts();
      });
      listEl.appendChild(row);
    }
  }

  const notes = DATA[state.person].notes || [];
  if (notes.length) {
    const block = document.createElement('div');
    block.className = 'notes-block';
    const p = document.createElement('p'); p.textContent = 'Notlar';
    const ul = document.createElement('ul');
    notes.forEach(n => { const li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
    block.appendChild(p); block.appendChild(ul);
    listEl.appendChild(block);
  }
}

function findSeries(person, testName) {
  const cats = DATA[person].categories;
  for (const cat in cats) {
    if (cats[cat][testName]) return { cat, series: cats[cat][testName] };
  }
  return null;
}

function buildDatasetArrays(series, dates) {
  let lastRef = null;
  const loArr = [], hiArr = [], valArr = [], colors = [], labels = [];
  const byDate = {}; series.pts.forEach(p => byDate[p.y] = p);
  dates.forEach(d => {
    const p = byDate[d];
    if (p && p.lo != null) lastRef = { lo: p.lo, hi: p.hi };
    loArr.push(lastRef ? lastRef.lo : null);
    hiArr.push(lastRef ? lastRef.hi : null);
    valArr.push(p ? p.v : null);
    colors.push(p && isAbn(p) ? '#e34948' : '#2a78d6');
    labels.push(p ? (p.disp || fmtNum(p.v)) : null);
  });
  return { byDate, loArr, hiArr, valArr, colors, labels };
}

// Draws the value as a static number above (or below, near the top edge) each point
// on the "value" dataset (index 2) - no hover required.
const valueLabelPlugin = {
  id: 'valueLabels',
  afterDatasetsDraw(chart) {
    const meta = chart.getDatasetMeta(2);
    if (!meta || meta.hidden) return;
    const ds = chart.data.datasets[2];
    const labels = ds.pointLabels || [];
    const opts = (chart.options.plugins && chart.options.plugins.valueLabels) || {};
    const fontSize = opts.fontSize || 13;
    const offset = opts.offset || 12;
    const { ctx, chartArea } = chart;
    ctx.save();
    ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    meta.data.forEach((point, idx) => {
      const label = labels[idx];
      if (label == null || label === '') return;
      const near_top = point.y - chartArea.top < offset + 8;
      ctx.fillStyle = (ds.pointBackgroundColor && ds.pointBackgroundColor[idx]) || '#2a78d6';
      ctx.textBaseline = near_top ? 'top' : 'bottom';
      ctx.fillText(label, point.x, near_top ? point.y + offset : point.y - offset);
    });
    ctx.restore();
  }
};

function renderCharts() {
  if (!state.test_name) return;
  document.getElementById('metricTitle').textContent = state.test_name;

  const relatedTests = relatedFor(state.person, state.test_name);
  document.getElementById('metricSub').textContent = relatedTests.length
    ? `${state.test_cat} · ${relatedTests.length} ilişkili test birlikte gösteriliyor`
    : state.test_cat;

  const listEl = document.getElementById('chartList');
  listEl.innerHTML = '';
  if (state.charts) state.charts.forEach(c => c.destroy());
  state.charts = [];

  const items = [{ test: state.test_name, primary: true }]
    .concat(relatedTests.map(t => ({ test: t, primary: false })));
  const dates = DATA[state.person].meta.dates;
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const relatedGrid = document.createElement('div');
  relatedGrid.className = 'related-grid';

  items.forEach((item, idx) => {
    const found = findSeries(state.person, item.test);
    if (!found) return;
    const series = found.series;
    const { byDate, loArr, hiArr, valArr, colors, labels } = buildDatasetArrays(series, dates);

    const card = document.createElement('div');
    card.className = 'chart-item' + (item.primary ? ' primary' : '');

    const head = document.createElement('div'); head.className = 'chart-item-head';
    const titleEl = document.createElement('p'); titleEl.className = 'chart-item-title';
    titleEl.textContent = item.test;
    if (!item.primary) {
      const dot = document.createElement('span'); dot.className = 'related-dot'; dot.textContent = '• ilişkili';
      titleEl.appendChild(dot);
    }
    const chartInfoBtn = document.createElement('button');
    chartInfoBtn.className = 'info-btn'; chartInfoBtn.type = 'button';
    chartInfoBtn.textContent = '?';
    chartInfoBtn.setAttribute('aria-label', item.test + ' hakkında bilgi');
    chartInfoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openInfoModal(found.cat, item.test, series, latestPt(series));
    });
    head.appendChild(titleEl);
    head.appendChild(chartInfoBtn);
    card.appendChild(head);

    const canvasWrap = document.createElement('div'); canvasWrap.className = 'chart-item-canvas-wrap';
    const canvas = document.createElement('canvas');
    canvasWrap.appendChild(canvas);
    card.appendChild(canvasWrap);

    const allVals = [...loArr, ...hiArr, ...valArr].filter(v => v != null);
    let yMin, yMax;
    if (allVals.length) {
      const dataMin = Math.min(...allVals);
      const dataMax = Math.max(...allVals);
      const span = dataMax - dataMin;
      const pad = span > 0 ? span * 0.10 : (Math.abs(dataMax) || 1) * 0.10;
      yMin = dataMin - pad;
      yMax = dataMax + pad;
    }

    const chart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: dates,
        datasets: [
          { label: '', data: loArr, borderColor: isDark ? '#5b5a54' : '#a6a49c', borderWidth: 1,
            borderDash: [4, 4], pointRadius: 0, fill: false, spanGaps: true },
          { label: 'Referans Aralığı', data: hiArr, borderColor: isDark ? '#5b5a54' : '#a6a49c', borderWidth: 1,
            borderDash: [4, 4], pointRadius: 0, fill: '-1',
            backgroundColor: isDark ? 'rgba(195,194,183,0.15)' : 'rgba(137,135,129,0.18)', spanGaps: true },
          { label: item.test, data: valArr, borderColor: '#2a78d6', borderWidth: 2, spanGaps: true,
            pointBackgroundColor: colors, pointBorderColor: colors, pointRadius: 5, pointHoverRadius: 5,
            pointLabels: labels }
        ]
      },
      plugins: [valueLabelPlugin],
      options: {
        responsive: true, maintainAspectRatio: false, events: [],
        layout: { padding: { top: item.primary ? 22 : 16, bottom: 2 } },
        plugins: {
          valueLabels: item.primary ? { fontSize: 13, offset: 12 } : { fontSize: 8, offset: 6 },
          legend: {
            display: idx === 0, position: 'top', align: 'end',
            labels: { filter: (li) => li.text !== '', color: '#898781', boxWidth: 14, font: { size: 12.5 } }
          },
          tooltip: { enabled: false }
        },
        scales: {
          y: { min: yMin, max: yMax, grid: { color: isDark ? '#2c2c2a' : '#e1e0d9' }, ticks: { color: '#898781', font: { size: item.primary ? 12 : 9.5 } } },
          x: { grid: { display: false }, ticks: {
            color: '#898781', maxRotation: item.primary ? 45 : 0, minRotation: 0,
            font: { size: item.primary ? 11.5 : 9 },
            callback: (value, i) => {
              const label = dates[i];
              if (!label) return '';
              return item.primary ? label : label.split('.')[2];
            }
          } }
        }
      }
    });
    state.charts.push(chart);

    const last = latestPt(series);
    const missing = dates.filter(d => !byDate[d]);
    let cap = last.lo != null
      ? `Referans: ${fmtNum(last.lo)} - ${fmtNum(last.hi)} ${last.unit || series.unit}.`
      : `Referans aralığı bilinmiyor.`;
    if (missing.length) cap += ' Veri yok: ' + missing.join(', ') + '.';
    const captionEl = document.createElement('p'); captionEl.className = 'chart-item-caption';
    captionEl.textContent = cap;
    card.appendChild(captionEl);

    const notedPts = series.pts.filter(p => p.note);
    if (notedPts.length) {
      const noteEl = document.createElement('p'); noteEl.className = 'chart-item-note';
      noteEl.textContent = notedPts.map(p => `${p.y}: ${p.note}`).join(' ');
      card.appendChild(noteEl);
    }

    if (item.primary) {
      listEl.appendChild(card);
    } else {
      relatedGrid.appendChild(card);
    }
  });

  if (relatedGrid.children.length) {
    listEl.appendChild(relatedGrid);
  }
}

function openInfoModal(cat, test, series, last) {
  document.getElementById('infoTitle').textContent = test;
  document.getElementById('infoCat').textContent = cat;
  document.getElementById('infoDesc').textContent =
    TEST_INFO[test] || 'Bu test için henüz bir açıklama eklenmedi.';

  const relatedEl = document.getElementById('infoRelated');
  const related = relatedFor(state.person, test);
  if (related.length) {
    relatedEl.textContent = `İlişkili testler: ${related.join(', ')}. Bu testler genellikle birlikte değerlendirilir; ` +
      `bu testi seçtiğinizde listede işaretlenir ve grafik alanında alt alta gösterilirler.`;
    relatedEl.style.display = '';
  } else {
    relatedEl.style.display = 'none';
  }

  const refEl = document.getElementById('infoRef');
  if (last && last.lo != null) {
    refEl.textContent = `Bu rapordaki referans aralığı: ${fmtNum(last.lo)} - ${fmtNum(last.hi)} ${last.unit || series.unit}`;
    refEl.style.display = '';
  } else {
    refEl.textContent = 'Bu test için referans aralığı raporda belirtilmemiş.';
    refEl.style.display = '';
  }
  document.getElementById('infoOverlay').classList.add('open');
}
function closeInfoModal() {
  document.getElementById('infoOverlay').classList.remove('open');
}
document.getElementById('infoClose').addEventListener('click', closeInfoModal);
document.getElementById('infoOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'infoOverlay') closeInfoModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeInfoModal();
});

initPersonSelect();
selectPerson(Object.keys(DATA)[0]);
</script>
